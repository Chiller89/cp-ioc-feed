name: Build Check Point IoC feed

on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden
  workflow_dispatch:          # manuell startbar

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed bauen
        run: python build_feed.py cp_ioc_feed.csv

      - name: Commit, falls geaendert
        run: |
          git config user.name  "ioc-feed-bot"
          git config user.email "ioc-feed-bot@users.noreply.github.com"
          git add cp_ioc_feed.csv
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "IoC-Feed aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
